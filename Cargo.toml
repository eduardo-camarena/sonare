[package]
name = "sonare"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = {version = "0.9.0", features = ["sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
